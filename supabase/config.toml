# Edge functions. verify_jwt = true means only requests with a valid Supabase
# session token (including our silent anonymous sessions) can call them, which
# keeps the GROQ_API_KEY from being abused by anonymous internet traffic.
[functions.invoke-llm]
verify_jwt = true

[functions.generate-image]
verify_jwt = true

# send-push is server-to-server (cron / backend). It does its own auth via the
# x-push-secret shared secret, so JWT verification is disabled here.
[functions.send-push]
verify_jwt = false
